{% extends 'base.html' %}

{% block title %}Delete Item - Smart Campus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirm Deletion</h5>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete <strong>"{{ object.name }}"</strong>?</p>
                <p class="text-muted small">This action cannot be undone. All associated matches will also be removed.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger flex-grow-1">Yes, Delete Forever</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
